[package]
name = "extension-service"
version = "0.1.0"
edition = "2021"
description = "Servicio Rust de la extensión de CollectiveAccess Providence. Agrupa la lógica de los módulos."
publish = false

[dependencies]
tiny_http = "0.12"
json = "0.12"
# Cliente MySQL síncrono (como tiny_http). Sin TLS ni dependencias de C: la base está en la red de Docker
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
