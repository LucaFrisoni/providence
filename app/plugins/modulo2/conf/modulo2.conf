# Configuración del plugin del módulo 2 (administración gráfica de configuraciones)

# 1 = plugin activo, 0 = desactivado
enabled = 1

# URL base del servicio Rust de la extensión (ver rust/extension-service).
# En Docker se usa la variable de entorno EXTENSION_SERVICE_URL, que tiene prioridad.
service_url = http://127.0.0.1:8000

# Tiempo máximo de espera de cada petición al servicio, en segundos
service_timeout = 5

# 1 = cada versión de la configuración incluye, además de app/conf/local, la exportación de la
# configuración que Providence guarda en su base (listas, elementos de metadatos, interfaces, roles...),
# hecha con su exportador de perfiles. Tarda un par de segundos y se hace antes de cada cambio.
# 0 = las versiones guardan solo app/conf/local.
version_database = 1
