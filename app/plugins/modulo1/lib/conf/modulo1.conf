# Configuración del plugin del módulo 1 (exploración del modelo de información)
# 1 = plugin activo, 0 = desactivado
enabled = 1

# URL base del servicio Rust de la extensión (ver rust/extension-service).
# En Docker se usa la variable de entorno EXTENSION_SERVICE_URL, que tiene prioridad.
service_url = http://127.0.0.1:8000

# Tiempo máximo de espera de cada petición al servicio, en segundos
service_timeout = 5
