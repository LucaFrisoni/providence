# La dirección del contenedor Docker que ejecuta nuestro servicio de Rust.
# En la red interna de Docker, "extension-service" equivale a la IP del contenedor de Rust.
extension_service_url = "http://extension-service:8000"
rust_service_url = "http://extension-service:8000"

# Asociación automática (al importar datos en un campo MultiSource, cuando nadie elige a mano).
# MultiSource.php solo asocia la URI si el mejor candidato tiene un puntaje mayor o igual al umbral
# Y le saca al segundo al menos el margen. Si no, no asocia nada y lo anota en el log de Providence.
# Con el puntaje actual (1.0 idéntico, 0.8 empieza igual, 0.6 lo contiene, 0.3 otro) estos valores
# significan "una sola coincidencia idéntica".
auto_match_threshold = 0.95
auto_match_margin = 0.15

# Si la coincidencia tiene entre 70% y 95%, se marca como "Riesgo" y requiere revisión humana.
risk_warning_threshold = 0.70

# Lista de fuentes externas habilitadas.
enabled_sources = ["wikidata", "viaf", "geonames"]