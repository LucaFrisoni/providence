	"If set to 'yes' the path of menu options taken to reach the current screen will be displayed at the top of every screen" = { az_AZ = "«Bəli» seçilsə, cari ekrana çatmaq üçün keçilən menyu yolu hər ekranın yuxarısında göstərilir", el_GR = "Αν οριστεί σε «ναι», η διαδρομή επιλογών μενού προς την τρέχουσα οθόνη θα εμφανίζεται στο πάνω μέρος κάθε οθόνης", pt_BR = "Se escolher «sim», o caminho das opções de menu seguidas até a tela atual é mostrado no topo de cada tela", pt_PT = "Se escolher «sim», o caminho das opções de menu seguidas até ao ecrã atual é mostrado no topo de cada ecrã", sr_RS = "Ако је подешено на „да”, путања кроз мени до тренутног екрана приказује се на врху сваког екрана", uk_UA = "Якщо вибрано «так», шлях пунктів меню до поточного екрана показується вгорі кожного екрана" },
	"If set, id values referring to foreign keys are returned as preferred label text in the current locale." = { az_AZ = "Seçilibsə, digər qeydlərə istinad edən ID-lər cari dildə onların üstün tutulan adı kimi qaytarılır.", cs_CZ = "Je-li zaškrtnuto, identifikátory odkazující na jiné záznamy se vracejí jako jejich preferovaný název v aktuálním jazyce.", de_AT = "Wenn aktiviert, werden IDs, die auf andere Datensätze verweisen, als deren bevorzugte Bezeichnung in der aktuellen Sprache zurückgegeben.", de_DE = "Wenn aktiviert, werden IDs, die auf andere Datensätze verweisen, als deren bevorzugte Bezeichnung in der aktuellen Sprache zurückgegeben.", el_GR = "Αν οριστεί, οι τιμές id που αναφέρονται σε ξένα κλειδιά επιστρέφονται ως το κείμενο της προτιμώμενης ετικέτας στην τρέχουσα γλώσσα.", es_ES = "Si se marca, los identificadores que apuntan a otros registros se devuelven como su nombre preferido en el idioma actual.", es_MX = "Si se marca, los identificadores que apuntan a otros registros se devuelven como su nombre preferido en el idioma actual.", fr_CA = "Si coché, les identifiants qui renvoient à d'autres enregistrements sont rendus sous forme de leur libellé préféré dans la langue actuelle.", fr_FR = "Si coché, les identifiants qui renvoient à d'autres enregistrements sont rendus sous forme de leur libellé préféré dans la langue actuelle.", he_IL = "אם מסומן, מזהים שמפנים לרשומות אחרות מוחזרים כשמם המועדף בשפה הנוכחית.", hu_HU = "Ha be van jelölve, a más rekordokra mutató azonosítók a jelenlegi nyelven érvényes elsődleges megnevezésükként jelennek meg.", it_IT = "Se selezionato, gli ID che rimandano ad altre schede vengono restituiti come la loro denominazione preferita nella lingua attuale.", nl_BE = "Indien aangevinkt, worden ID's die naar andere records verwijzen teruggegeven als hun voorkeursbenaming in de huidige taal.", nl_NL = "Indien aangevinkt, worden ID's die naar andere records verwijzen teruggegeven als hun voorkeursbenaming in de huidige taal.", pl_PL = "Jeśli zaznaczone, identyfikatory wskazujące inne rekordy są zwracane jako ich nazwa preferowana w bieżącym języku.", pt_BR = "Se marcado, os ID que remetem para outros registros são devolvidos como a sua designação preferida no idioma atual.", pt_PT = "Se assinalado, os ID que remetem para outros registos são devolvidos como a sua designação preferida no idioma atual.", sr_RS = "Ако је подешено, id вредности које упућују на стране кључеве враћају се као текст основне ознаке на тренутном језику.", sv_SE = "Om markerat returneras ID:n som pekar på andra poster som deras föredragna benämning på det aktuella språket.", uk_UA = "Якщо позначено, ідентифікатори, що посилаються на інші записи, повертаються як їхня основна назва поточною мовою." },
