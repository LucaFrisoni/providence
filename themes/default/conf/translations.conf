	"If checked all stops in the tour will be included." = { de_AT = "Wenn aktiviert, werden alle Stationen der Tour übernommen.", el_GR = "Αν επιλεγεί, θα συμπεριληφθούν όλες οι στάσεις της περιήγησης.", hu_HU = "Ha be van jelölve, a túra összes állomása bekerül.", sr_RS = "Ако је означено, биће укључене све станице туре.", sv_SE = "Om markerat tas alla stopp i visningen med." },
