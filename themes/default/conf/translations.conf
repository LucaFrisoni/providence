	"User can use dashboard widget that lists recent user logins." = { az_AZ = "İstifadəçi son girişləri göstərən vidjetdən istifadə edə bilər.", el_GR = "Ο χρήστης μπορεί να χρησιμοποιεί το γραφικό στοιχείο πρόσφατων συνδέσεων.", hu_HU = "A felhasználó használhatja a legutóbbi bejelentkezéseket listázó widgetet.", pt_BR = "O usuário pode usar o widget que lista os logins recentes.", pt_PT = "O utilizador pode usar o widget que lista os inícios de sessão recentes.", sr_RS = "Корисник може да користи виџет последњих пријава." },
