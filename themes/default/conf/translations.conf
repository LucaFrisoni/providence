	"If checked user has verified they are over 18 years of age." = { az_AZ = "Seçilərsə, istifadəçi 18 yaşdan yuxarı olduğunu təsdiqləyib.", de_AT = "Wenn aktiviert, hat der Benutzer bestätigt, dass er über 18 Jahre alt ist.", de_DE = "Wenn aktiviert, hat der Benutzer bestätigt, dass er über 18 Jahre alt ist.", el_GR = "Αν επιλεγεί, ο χρήστης έχει επιβεβαιώσει ότι είναι άνω των 18 ετών.", es_ES = "Si está marcado, el usuario confirmó que es mayor de 18 años.", es_MX = "Si está marcado, el usuario confirmó que es mayor de 18 años.", he_IL = "אם מסומן, המשתמש אישר שמלאו לו 18 שנים.", hu_HU = "Ha be van jelölve, a felhasználó megerősítette, hogy elmúlt 18 éves.", it_IT = "Se selezionato, l’utente ha confermato di avere più di 18 anni.", nl_BE = "Indien aangevinkt heeft de gebruiker bevestigd ouder dan 18 jaar te zijn.", nl_NL = "Indien aangevinkt heeft de gebruiker bevestigd ouder dan 18 jaar te zijn.", pl_PL = "Jeśli zaznaczone, użytkownik potwierdził, że ma ukończone 18 lat.", pt_BR = "Se marcado, o usuário confirmou ter mais de 18 anos.", pt_PT = "Se marcado, o utilizador confirmou ter mais de 18 anos.", sr_RS = "Ако је означено, корисник је потврдио да има више од 18 година.", sv_SE = "Om markerat har användaren bekräftat att hen är över 18 år.", uk_UA = "Якщо позначено, користувач підтвердив, що йому більше 18 років." },
	"If checked zero totals will be hidden." = { az_AZ = "Seçilərsə, sıfır saylar gizlədilir.", cs_CZ = "Je-li zaškrtnuto, nulové počty se skryjí.", de_AT = "Wenn aktiviert, werden Nullwerte ausgeblendet.", de_DE = "Wenn aktiviert, werden Nullwerte ausgeblendet.", el_GR = "Αν επιλεγεί, οι μηδενικές μετρήσεις αποκρύπτονται.", es_ES = "Si está marcado, se ocultan los totales en cero.", es_MX = "Si está marcado, se ocultan los totales en cero.", fr_CA = "Si coché, les totaux nuls sont masqués.", fr_FR = "Si coché, les totaux nuls sont masqués.", he_IL = "אם מסומן, ספירות אפס יוסתרו.", hu_HU = "Ha be van jelölve, a nulla értékek rejtve maradnak.", it_IT = "Se selezionato, i totali a zero vengono nascosti.", nl_BE = "Indien aangevinkt worden nulwaarden verborgen.", nl_NL = "Indien aangevinkt worden nulwaarden verborgen.", pl_PL = "Jeśli zaznaczone, zerowe liczby są ukrywane.", pt_BR = "Se marcado, os totais a zero são ocultados.", pt_PT = "Se assinalado, os totais a zero são ocultados.", sr_RS = "Ако је означено, нулти бројеви се сакривају.", sv_SE = "Om markerat döljs antal som är noll.", uk_UA = "Якщо позначено, нульові значення приховуються." },
	"If enabled display of time will be to the second. Otherwise it will be to the minute." = { az_AZ = "Aktivdirsə, vaxt saniyəyə qədər göstərilir; əks halda dəqiqəyə qədər.", el_GR = "Αν ενεργοποιηθεί, η ώρα εμφανίζεται με δευτερόλεπτα· αλλιώς με λεπτά.", hu_HU = "Ha be van kapcsolva, az idő másodpercre pontosan jelenik meg, egyébként percre.", it_IT = "Se attivo, l'ora viene mostrata al secondo; altrimenti al minuto.", pt_BR = "Se ativo, a hora é mostrada com segundos; caso contrário, com minutos.", pt_PT = "Se ativo, a hora é mostrada ao segundo; caso contrário, ao minuto.", sr_RS = "Ако је укључено, време се приказује са секундама; иначе са минутима.", uk_UA = "Якщо ввімкнено, час показується з секундами; інакше — з хвилинами." },
	"If set all interstitial fields for all selected relationships will be duplicated." = { az_AZ = "Seçilibsə, seçilmiş bütün münasibətlərin bütün aralıq sahələri təkrarlanır.", de_AT = "Wenn aktiviert, werden alle Zwischenfelder aller ausgewählten Beziehungen dupliziert.", de_DE = "Wenn aktiviert, werden alle Zwischenfelder aller ausgewählten Beziehungen dupliziert.", el_GR = "Αν οριστεί, θα αντιγραφούν όλα τα ενδιάμεσα πεδία όλων των επιλεγμένων σχέσεων.", es_ES = "Si se marca, se duplican todos los campos intermedios de todas las relaciones elegidas.", es_MX = "Si se marca, se duplican todos los campos intermedios de todas las relaciones elegidas.", fr_CA = "Si coché, tous les champs intermédiaires de toutes les relations choisies sont dupliqués.", he_IL = "אם מסומן, משוכפלים כל שדות הביניים של כל הקשרים שנבחרו.", hu_HU = "Ha be van jelölve, az összes kiválasztott kapcsolat minden köztes mezője duplikálódik.", it_IT = "Se selezionato, vengono duplicati tutti i campi intermedi di tutte le relazioni scelte.", nl_BE = "Indien aangevinkt, worden alle tussenvelden van alle gekozen relaties gedupliceerd.", nl_NL = "Indien aangevinkt, worden alle tussenvelden van alle gekozen relaties gedupliceerd.", pl_PL = "Jeśli zaznaczone, powielane są wszystkie pola pośrednie wszystkich wybranych powiązań.", pt_BR = "Se marcado, são duplicados todos os campos intermediários de todas as relações escolhidas.", pt_PT = "Se assinalado, duplicam-se todos os campos intermédios de todas as relações escolhidas.", sr_RS = "Ако је подешено, биће дуплирана сва поља самих односа за све изабране односе.", sv_SE = "Om markerat dupliceras alla mellanliggande fält i alla valda relationer.", uk_UA = "Якщо позначено, дублюються всі проміжні поля всіх вибраних зв'язків." },
