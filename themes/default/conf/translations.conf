	"Use the browser to explore the hierarchy. You may edit other hierarchy items by clicking on the arrows." = { az_AZ = "İyerarxiyanı araşdırmaq üçün baxıcıdan istifadə edin. Oxlara klikləyərək iyerarxiyanın digər elementlərini redaktə edə bilərsiniz.", el_GR = "Χρησιμοποιήστε την περιήγηση για να εξερευνήσετε την ιεραρχία. Μπορείτε να επεξεργαστείτε άλλα στοιχεία της ιεραρχίας κάνοντας κλικ στα βέλη.", pt_BR = "Use o navegador para explorar a hierarquia. Pode editar outros itens da hierarquia clicando nas setas.", pt_PT = "Use o navegador para explorar a hierarquia. Pode editar outros itens da hierarquia clicando nas setas.", sr_RS = "Користите прегледач да истражите хијерархију. Друге ставке хијерархије можете уређивати кликом на стрелице.", sv_SE = "Använd bläddraren för att utforska hierarkin. Du kan redigera andra poster i hierarkin genom att klicka på pilarna.", uk_UA = "Використовуйте переглядач, щоб досліджувати ієрархію. Інші елементи ієрархії можна редагувати, клацаючи стрілки." },
	"Use the button above to add a widget to your dashboard.  You can drag and drop the widgets in the left or right columns in the order you would like them to appear.  To customize the information in each widget, click the <i>\"i\"</i> button in the upper right corner of the widget.  To remove the widget from your dashboard click the \"X\" button in the upper right corner of the widget.  Click the \"Clear dashboard\" button above to remove all widgets from your dashboard.  When you are finished editing your dashboard, click the \"Done\" button above." = { az_AZ = "İdarə panelinə vidjet əlavə etmək üçün yuxarıdakı düymədən istifadə edin. Vidjetləri sol və sağ sütunlarda istədiyiniz sıraya sürükləyə bilərsiniz. Hər vidjetin məlumatını fərdiləşdirmək üçün vidjetin sağ üst küncündəki <i>\"i\"</i> düyməsini klikləyin. Vidjeti silmək üçün eyni küncdəki \"X\" düyməsini klikləyin. Bütün vidjetləri silmək üçün yuxarıdakı \"İdarə panelini təmizlə\" düyməsini klikləyin. Bitirdikdə yuxarıdakı \"Hazır\" düyməsini klikləyin.", el_GR = "Χρησιμοποιήστε το κουμπί παραπάνω για να προσθέσετε ένα γραφικό στοιχείο στον πίνακα ελέγχου. Μπορείτε να σύρετε τα γραφικά στοιχεία στην αριστερή και τη δεξιά στήλη με τη σειρά που θέλετε. Για να προσαρμόσετε τις πληροφορίες κάθε γραφικού στοιχείου, κάντε κλικ στο κουμπί <i>«i»</i> επάνω δεξιά. Για να το αφαιρέσετε, κάντε κλικ στο κουμπί «X» στην ίδια γωνία. Το κουμπί «Εκκαθάριση πίνακα ελέγχου» αφαιρεί όλα τα γραφικά στοιχεία. Όταν τελειώσετε, κάντε κλικ στο κουμπί «Τέλος» παραπάνω.", hu_HU = "A fenti gombbal adhat widgetet az irányítópulthoz. A widgeteket a bal és jobb oszlopban tetszőleges sorrendbe húzhatja. Egy widget adatainak testreszabásához kattintson a jobb felső sarkában lévő <i>„i”</i> gombra. Az eltávolításához kattintson ugyanott az „X” gombra. Az összes widget eltávolításához kattintson fent az „Irányítópult kiürítése” gombra. Ha végzett, kattintson fent a „Kész” gombra.", pt_BR = "Use o botão acima para adicionar um widget ao painel. Pode arrastar os widgets nas colunas esquerda e direita para os ordenar. Para personalizar a informação de cada widget, clique no botão <i>\"i\"</i> no canto superior direito do widget. Para o retirar do painel, clique no botão \"X\" no mesmo canto. O botão \"Limpar o painel\" acima retira todos os widgets. Quando terminar, clique no botão \"Concluído\" acima.", pt_PT = "Use o botão acima para adicionar um widget ao painel. Pode arrastar os widgets nas colunas esquerda e direita para os ordenar. Para personalizar a informação de cada widget, clique no botão <i>\"i\"</i> no canto superior direito do widget. Para o retirar do painel, clique no botão \"X\" no mesmo canto. O botão \"Limpar o painel\" acima retira todos os widgets. Quando terminar, clique no botão \"Concluído\" acima.", sr_RS = "Дугметом изнад додајете виџет на контролну таблу. Виџете у левој и десној колони можете превлачити у редослед који желите. Да прилагодите податке виџета, кликните на дугме <i>„i”</i> у горњем десном углу виџета. Да уклоните виџет, кликните на дугме „X” у истом углу. Дугме „Очисти контролну таблу” изнад уклања све виџете. Кад завршите, кликните на дугме „Готово” изнад." },
	"Use user sorts" = { az_AZ = "İstifadəçi çeşidləmələrindən istifadə et", de_AT = "Benutzersortierungen verwenden", de_DE = "Benutzersortierungen verwenden", el_GR = "Χρήση ταξινομήσεων χρηστών", es_ES = "Usar las ordenaciones de usuario", es_MX = "Usar las ordenaciones de usuario", fr_CA = "Utiliser les tris d'utilisateur", he_IL = "שימוש במיוני משתמשים", hu_HU = "Felhasználói rendezések használata", it_IT = "Usa gli ordinamenti degli utenti", nl_BE = "Gebruikerssorteringen gebruiken", nl_NL = "Gebruikerssorteringen gebruiken", pl_PL = "Używaj sortowań użytkowników", pt_BR = "Usar as ordenações de usuário", pt_PT = "Usar as ordenações de utilizador", sr_RS = "Користи корисничка сортирања", sv_SE = "Använd användarsorteringar", uk_UA = "Використовувати сортування користувачів" },
