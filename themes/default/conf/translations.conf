	"2 or 3 character language code for locale; use the ISO 639-1 standard for two letter codes or ISO 639-2 for three letter codes." = { az_AZ = "2 və ya 3 simvollu dil kodu; iki hərfli kodlar üçün ISO 639-1, üç hərfli kodlar üçün ISO 639-2 istifadə edin.", cs_CZ = "Dvou- nebo třímístný kód jazyka; pro dvoupísmenné kódy použijte ISO 639-1, pro třípísmenné ISO 639-2.", de_AT = "Sprachcode mit 2 oder 3 Zeichen; verwenden Sie ISO 639-1 für zweistellige oder ISO 639-2 für dreistellige Codes.", de_DE = "Sprachcode mit 2 oder 3 Zeichen; verwenden Sie ISO 639-1 für zweistellige oder ISO 639-2 für dreistellige Codes.", el_GR = "Κωδικός γλώσσας 2 ή 3 χαρακτήρων· χρησιμοποιήστε το ISO 639-1 για διψήφιους κωδικούς ή το ISO 639-2 για τριψήφιους.", es_ES = "Código de idioma de 2 o 3 caracteres; use el estándar ISO 639-1 para los códigos de dos letras o el ISO 639-2 para los de tres.", es_MX = "Código de idioma de 2 o 3 caracteres; use el estándar ISO 639-1 para los códigos de dos letras o el ISO 639-2 para los de tres.", fr_CA = "Code de langue sur 2 ou 3 caractères ; utilisez la norme ISO 639-1 pour les codes à deux lettres ou ISO 639-2 pour ceux à trois lettres.", fr_FR = "Code de langue sur 2 ou 3 caractères ; utilisez la norme ISO 639-1 pour les codes à deux lettres ou ISO 639-2 pour ceux à trois lettres.", he_IL = "קוד שפה בן 2 או 3 תווים; השתמשו ב-ISO 639-1 לקודים בני שתי אותיות או ב-ISO 639-2 לקודים בני שלוש.", hu_HU = "2 vagy 3 karakteres nyelvkód; kétbetűs kódokhoz az ISO 639-1, hárombetűsökhöz az ISO 639-2 szabványt használja.", it_IT = "Codice della lingua di 2 o 3 caratteri; usare lo standard ISO 639-1 per i codici di due lettere o ISO 639-2 per quelli di tre.", nl_BE = "Taalcode met 2 of 3 tekens; gebruik ISO 639-1 voor codes van twee letters of ISO 639-2 voor codes van drie letters.", nl_NL = "Taalcode met 2 of 3 tekens; gebruik ISO 639-1 voor codes van twee letters of ISO 639-2 voor codes van drie letters.", pl_PL = "Dwu- lub trzyznakowy kod języka; użyj normy ISO 6