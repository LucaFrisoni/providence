	"User can use dashboard widget that lists recently created registrations." = { az_AZ = "İstifadəçi son qeydiyyatları göstərən vidjetdən istifadə edə bilər.", de_AT = "Der Benutzer kann das Widget mit den letzten Registrierungen verwenden.", de_DE = "Der Benutzer kann das Widget mit den letzten Registrierungen verwenden.", el_GR = "Ο χρήστης μπορεί να χρησιμοποιεί το γραφικό στοιχείο πρόσφατων εγγραφών χρηστών.", es_ES = "El usuario puede usar el widget que lista los registros de usuarios recientes.", es_MX = "El usuario puede usar el widget que lista los registros de usuarios recientes.", he_IL = "המשתמש יכול להשתמש בווידג'ט שמציג הרשמות אחרונות.", hu_HU = "A felhasználó használhatja a legutóbbi regisztrációkat listázó widgetet.", it_IT = "L'utente può usare il widget delle registrazioni recenti.", nl_BE = "De gebruiker kan de widget met recente registraties gebruiken.", nl_NL = "De gebruiker kan de widget met recente registraties gebruiken.", pl_PL = "Użytkownik może używać widżetu ostatnich rejestracji.", pt_BR = "O usuário pode usar o widget que lista os registros de usuários recentes.", pt_PT = "O utilizador pode usar o widget que lista os registos de utilizadores recentes.", sr_RS = "Корисник може да користи виџет недавних регистрација.", sv_SE = "Användaren kan använda widgeten med senaste registreringar.", uk_UA = "Користувач може використовувати віджет останніх реєстрацій." },
