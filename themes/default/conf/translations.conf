	"Determines if the last performed search, basic or advanced, or browse is retained after navigation away from results display" = { az_AZ = "Son axtarışın (sadə və ya genişləndirilmiş) və ya baxışın nəticələrdən çıxdıqdan sonra saxlanmasını təyin edir", de_DE = "Legt fest, ob die zuletzt ausgeführte Suche (einfach oder erweitert) bzw. das Durchsuchen beim Verlassen der Ergebnisse erhalten bleibt", el_GR = "Ορίζει αν η τελευταία αναζήτηση (βασική ή σύνθετη) ή περιήγηση διατηρείται όταν φεύγετε από τα αποτελέσματα", hu_HU = "Meghatározza, hogy a legutóbbi (egyszerű vagy összetett) keresés vagy böngészés megmarad-e a találatok elhagyása után", pt_BR = "Define se a última busca (básica ou avançada) ou navegação é mantida ao sair dos resultados", pt_PT = "Define se a última pesquisa (básica ou avançada) ou navegação é mantida ao sair dos resultados", sr_RS = "Одређује да ли се последња претрага (основна или напредна) или прегледање задржава после напуштања резултата", sv_SE = "Anger om den senaste sökningen (enkel eller avancerad) eller bläddringen sparas när du lämnar resultaten" },
	"Determines if the previous Quicksearch terms clear automatically when a new search is performed, or if the search terms remain editable for the next search." = { az_AZ = "Yeni axtarışda əvvəlki sürətli axtarış sözlərinin avtomatik silinməsini və ya növbəti axtarış üçün redaktə oluna bilməsini təyin edir.", de_DE = "Legt fest, ob die vorherigen Begriffe der Schnellsuche bei einer neuen Suche automatisch gelöscht werden oder für die nächste Suche bearbeitbar bleiben.", el_GR = "Ορίζει αν οι προηγούμενοι όροι της γρήγορης αναζήτησης διαγράφονται αυτόματα σε νέα αναζήτηση ή παραμένουν επεξεργάσιμοι.", pt_BR = "Define se os termos anteriores da busca rápida são limpos automaticamente em uma nova busca ou se ficam editáveis para a seguinte.", pt_PT = "Define se os termos anteriores da pesquisa rápida são limpos automaticamente numa nova pesquisa ou se ficam editáveis para a seguinte.", sr_RS = "Одређује да ли се претходни термини брзе претраге аутоматски бришу при новој претрази или остају доступни за измену.", uk_UA = "Визначає, чи попередні терміни швидкого пошуку очищаються автоматично під час нового пошуку, чи залишаються для редагування." },
	"Determines preferred currency to use for display." = { az_AZ = "Göstərmək üçün üstün tutulan valyutanı müəyyən edir.", de_AT = "Legt die bevorzugte Währung für die Anzeige fest.", el_GR = "Καθορίζει το προτιμώμενο νόμισμα για την εμφάνιση.", hu_HU = "A megjelenítéshez előnyben részesített pénznemet adja meg.", nl_BE = "Bepaalt de voorkeursmunteenheid voor de weergave.", nl_NL = "Bepaalt de voorkeursmunteenheid voor de weergave.", sr_RS = "Одређује жељену валуту за приказ.", sv_SE = "Bestämmer vilken valuta som visas." },
	"Determines the clock's appearance. \"Analog\" will display the clock using a simulation of old-fashioned mechanical numbers. \"Digital\" will simply print the time numerically." = { az_AZ = "Saatın görünüşünü təyin edir. \"Analoq\" köhnə mexaniki rəqəmləri təqlid edir; \"Rəqəmsal\" vaxtı sadəcə rəqəmlərlə göstərir.", de_DE = "Legt das Aussehen der Uhr fest. „Analog“ ahmt mechanische Ziffern nach, „Digital“ zeigt die Uhrzeit einfach als Zahlen.", el_GR = "Ορίζει την εμφάνιση του ρολογιού. Το «Αναλογικό» μιμείται παλιούς μηχανικούς αριθμούς· το «Ψηφιακό» δείχνει απλώς την ώρα με αριθμούς.", hu_HU = "Az óra megjelenését határozza meg. Az „Analóg” régi mechanikus számokat utánoz, a „Digitális” egyszerűen számokkal mutatja az időt.", pt_BR = "Define o aspecto do relógio. \"Analógico\" imita os antigos números mecânicos; \"Digital\" mostra a hora em números.", pt_PT = "Define o aspeto do relógio. «Analógico» imita os antigos números mecânicos; «Digital» mostra a hora em números.", sr_RS = "Одређује изглед сата. „Аналогни” опонаша старе механичке бројеве; „Дигитални” само исписује време бројевима.", uk_UA = "Визначає вигляд годинника. «Аналоговий» імітує старі механічні цифри; «Цифровий» просто показує час числами." },
	"Determines units used to display measured quantities. Select 'units as entered' to display measurements in the form in which they were entered into the system." = { hu_HU = "A mért mennyiségek megjelenítésének mértékegységét adja meg. A „bevitt mértékegység” választásával a méretek abban a formában jelennek meg, ahogyan a rendszerbe bevitték őket.", uk_UA = "Визначає одиниці для відображення виміряних величин. Виберіть «одиниці як введено», щоб показувати виміри так, як їх ввели в систему." },
