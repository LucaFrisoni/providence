	"The SqlSearch2 search engine requires that MySQL be the back-end database for your CollectiveAccess installation." = { az_AZ = "SqlSearch2 axtarış mühərriki CollectiveAccess quraşdırmasının verilənlər bazasının MySQL olmasını tələb edir.", de_AT = "Die Suchmaschine SqlSearch2 setzt MySQL als Datenbank Ihrer CollectiveAccess-Installation voraus.", el_GR = "Η μηχανή αναζήτησης SqlSearch2 απαιτεί τη MySQL ως βάση δεδομένων της εγκατάστασης CollectiveAccess.", es_ES = "El motor de búsqueda SqlSearch2 necesita que la base de datos de CollectiveAccess sea MySQL.", es_MX = "El motor de búsqueda SqlSearch2 necesita que la base de datos de CollectiveAccess sea MySQL.", fr_CA = "Le moteur de recherche SqlSearch2 exige que la base de données de votre installation CollectiveAccess soit MySQL.", fr_FR = "Le moteur de recherche SqlSearch2 exige que la base de données de votre installation CollectiveAccess soit MySQL.", he_IL = "מנוע החיפוש SqlSearch2 דורש שמסד הנתונים של התקנת CollectiveAccess יהיה MySQL.", hu_HU = "Az SqlSearch2 keresőmotorhoz a CollectiveAccess-telepítés adatbázisának MySQL-nek kell lennie.", it_IT = "Il motore di ricerca SqlSearch2 richiede che il database dell'installazione di CollectiveAccess sia MySQL.", nl_BE = "De zoekmachine SqlSearch2 vereist MySQL als database van uw CollectiveAccess-installatie.", nl_NL = "De zoekmachine SqlSearch2 vereist MySQL als database van uw CollectiveAccess-installatie.", pl_PL = "Wyszukiwarka SqlSearch2 wymaga, aby bazą danych instalacji CollectiveAccess był MySQL.", pt_BR = "O motor de pesquisa SqlSearch2 exige que a base de dados da instalação do CollectiveAccess seja MySQL.", pt_PT = "O motor de pesquisa SqlSearch2 exige que a base de dados da instalação do CollectiveAccess seja MySQL.", sr_RS = "Претраживач SqlSearch2 захтева да MySQL буде база података ваше CollectiveAccess инсталације.", sv_SE = "Sökmotorn SqlSearch2 kräver att CollectiveAccess-installationens databas är MySQL.", uk_UA = "Пошукова система SqlSearch2 вимагає, щоб базою даних інсталяції CollectiveAccess була MySQL." },
	"The SqlSearch2 search engine requires that certain tables be present in your database. They are installed by default and should be present, but if they are not SqlSearch2 will not be able to operate." = { az_AZ = "SqlSearch2 axtarış mühərriki verilənlər bazasında müəyyən cədvəllər tələb edir. Onlar standart olaraq quraşdırılır və mövcud olmalıdır; yoxdursa, SqlSearch2 işləyə bilməz.", cs_CZ = "Vyhledávač SqlSearch2 vyžaduje v databázi určité tabulky. Instalují se ve výchozím nastavení a měly by existovat; pokud chybí, SqlSearch2 nemůže fungovat.", de_AT = "Die Suchmaschine SqlSearch2 setzt bestimmte Tabellen in Ihrer Datenbank voraus. Sie werden standardmäßig installiert und sollten vorhanden sein; fehlen sie, kann SqlSearch2 nicht arbeiten.", de_DE = "Die Suchmaschine SqlSearch2 setzt bestimmte Tabellen in Ihrer Datenbank voraus. Sie werden standardmäßig installiert und sollten vorhanden sein; fehlen sie, kann SqlSearch2 nicht arbeiten.", el_GR = "Η μηχανή αναζήτησης SqlSearch2 απαιτεί ορισμένους πίνακες στη βάση δεδομένων σας. Εγκαθίστανται από προεπιλογή και θα πρέπει να υπάρχουν· αν λείπουν, το SqlSearch2 δεν μπορεί να λειτουργήσει.", es_ES = "El motor de búsqueda SqlSearch2 necesita ciertas tablas en la base de datos. Se instalan por defecto y deberían estar; si no están, SqlSearch2 no puede funcionar.", es_MX = "El motor de búsqueda SqlSearch2 necesita ciertas tablas en la base de datos. Se instalan por defecto y deberían estar; si no están, SqlSearch2 no puede funcionar.", fr_CA = "Le moteur de recherche SqlSearch2 exige certaines tables dans votre base de données. Elles sont installées par défaut et devraient être présentes ; sinon, SqlSearch2 ne peut pas fonctionner.", fr_FR = "Le moteur de recherche SqlSearch2 exige certaines tables dans votre base de données. Elles sont installées par défaut et devraient être présentes ; sinon, SqlSearch2 ne peut pas fonctionner.", he_IL = "מנוע החיפוש SqlSearch2 דורש טבלאות מסוימות במסד הנתונים. הן מותקנות כברירת מחדל ואמורות להיות קיימות; אם הן חסרות, SqlSearch2 לא יכול לפעול.", hu_HU = "Az SqlSearch2 keresőmotorhoz bizonyos táblák szükségesek az adatbázisban. Ezek alapértelmezés szerint települnek, és meg kell lenniük; ha hiányoznak, az SqlSearch2 nem működik.", it_IT = "Il motore di ricerca SqlSearch2 richiede alcune tabelle nel database. Vengono installate per impostazione predefinita e dovrebbero esserci; se mancano, SqlSearch2 non può funzionare.", nl_BE = "De zoekmachine SqlSearch2 vereist bepaalde tabellen in uw database. Die worden standaard geïnstalleerd en horen aanwezig te zijn; ontbreken ze, dan kan SqlSearch2 niet werken.", nl_NL = "De zoekmachine SqlSearch2 vereist bepaalde tabellen in uw database. Die worden standaard geïnstalleerd en horen aanwezig te zijn; ontbreken ze, dan kan SqlSearch2 niet werken.", pl_PL = "Wyszukiwarka SqlSearch2 wymaga określonych tabel w bazie danych. Są instalowane domyślnie i powinny istnieć; jeśli ich brak, SqlSearch2 nie może działać.", pt_BR = "O motor de pesquisa SqlSearch2 exige certas tabelas na base de dados. São instaladas por padrão e devem existir; se não existirem, o SqlSearch2 não pode funcionar.", pt_PT = "O motor de pesquisa SqlSearch2 exige certas tabelas na base de dados. São instaladas por predefinição e devem existir; se não existirem, o SqlSearch2 não pode funcionar.", sr_RS = "Претраживач SqlSearch2 захтева одређене табеле у вашој бази података. Подразумевано се инсталирају и требало би да постоје; ако их нема, SqlSearch2 неће моћи да ради.", sv_SE = "Sökmotorn SqlSearch2 kräver vissa tabeller i databasen. De installeras som standard och ska finnas; saknas de kan SqlSearch2 inte fungera.", uk_UA = "Пошукова система SqlSearch2 вимагає певних таблиць у базі даних. Вони встановлюються типово й мають бути наявні; якщо їх немає, SqlSearch2 не може працювати." },
	"The field of research the user is engaged in." = { az_AZ = "İstifadəçinin məşğul olduğu tədqiqat sahəsi.", de_AT = "Das Forschungsgebiet, in dem der Benutzer tätig ist.", de_DE = "Das Forschungsgebiet, in dem der Benutzer tätig ist.", el_GR = "Το ερευνητικό πεδίο με το οποίο ασχολείται ο χρήστης.", es_ES = "El área de investigación en la que trabaja el usuario.", es_MX = "El área de investigación en la que trabaja el usuario.", he_IL = "תחום המחקר שבו עוסק המשתמש.", hu_HU = "A kutatási terület, amellyel a felhasználó foglalkozik.", it_IT = "L’ambito di ricerca in cui lavora l’utente.", nl_BE = "Het onderzoeksgebied waarin de gebruiker actief is.", nl_NL = "Het onderzoeksgebied waarin de gebruiker actief is.", pl_PL = "Dziedzina badań, którą zajmuje się użytkownik.", pt_BR = "A área de pesquisa em que o usuário trabalha.", pt_PT = "A área de investigação em que o utilizador trabalha.", sr_RS = "Област истраживања којом се корисник бави.", sv_SE = "Det forskningsområde som användaren arbetar inom.", uk_UA = "Галузь досліджень, якою займається користувач." },
	"The label for this placement as defined in the placements settings. The value used will be adjusted to reflect the current user&apos;s locale." = { az_AZ = "Bu sahənin ayarlarına görə adı. İstifadəçinin dilində göstərilir.", cs_CZ = "Název tohoto pole podle jeho nastavení. Zobrazuje se v jazyce uživatele.", de_AT = "Die Bezeichnung dieser Platzierung laut ihren Einstellungen. Sie wird in der Sprache des Benutzers angezeigt.", de_DE = "Die Bezeichnung dieser Platzierung laut ihren Einstellungen. Sie wird in der Sprache des Benutzers angezeigt.", el_GR = "Το όνομα αυτού του πεδίου σύμφωνα με τις ρυθμίσεις του. Εμφανίζεται στη γλώσσα του χρήστη.", es_ES = "El nombre de este campo según la configuración del campo. Se muestra en el idioma del usuario.", es_MX = "El nombre de este campo según la configuración del campo. Se muestra en el idioma del usuario.", fr_CA = "Le libellé de ce champ selon ses paramètres. Il s'affiche dans la langue de l'utilisateur.", fr_FR = "Le libellé de ce champ selon ses paramètres. Il s'affiche dans la langue de l'utilisateur.", he_IL = "שם השדה הזה לפי ההגדרות שלו. הוא מוצג בשפת המשתמש.", hu_HU = "A mező megnevezése a beállításai szerint. A felhasználó nyelvén jelenik meg.", it_IT = "La denominazione di questo campo secondo le sue impostazioni. Viene mostrata nella lingua dell'utente.", nl_BE = "De benaming van dit veld volgens de instellingen. Ze wordt getoond in de taal van de gebruiker.", nl_NL = "De benaming van dit veld volgens de instellingen. Ze wordt getoond in de taal van de gebruiker.", pl_PL = "Nazwa tego pola według jego ustawień. Jest wyświetlana w języku użytkownika.", pt_BR = "A designação deste campo segundo as suas definições. É mostrada no idioma do usuário.", pt_PT = "A designação deste campo segundo as suas definições. É mostrada no idioma do utilizador.", sr_RS = "Назив овог поља према његовим подешавањима. Приказује се на језику корисника.", sv_SE = "Benämningen på detta fält enligt dess inställningar. Den visas på an