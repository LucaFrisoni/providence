	"This is your CollectiveAccess dashboard.  Click the \"Edit Dashboard\" button above to add widgets to your dashboard that will allow you to monitor system activity.  You'll see your dashboard whenever you login or  click the CollectiveAccess logo above." = { az_AZ = "Bu sizin CollectiveAccess idarə panelinizdir. Sistem fəaliyyətini izləmək üçün vidjet əlavə etməyə yuxarıdakı \"İdarə panelini redaktə et\" düyməsini klikləyin. İdarə panelini hər girişdə və ya yuxarıdakı CollectiveAccess loqosuna kliklədikdə görəcəksiniz.", de_DE = "Dies ist Ihr CollectiveAccess-Dashboard. Klicken Sie oben auf „Dashboard bearbeiten“, um Widgets hinzuzufügen, mit denen Sie die Aktivität des Systems verfolgen. Sie sehen Ihr Dashboard nach jeder Anmeldung oder wenn Sie oben auf das CollectiveAccess-Logo klicken.", el_GR = "Αυτός είναι ο πίνακας ελέγχου σας στο CollectiveAccess. Κάντε κλικ στο κουμπί «Επεξεργασία πίνακα ελέγχου» παραπάνω για να προσθέσετε γραφικά στοιχεία που παρακολουθούν τη δραστηριότητα του συστήματος. Θα βλέπετε τον πίνακα ελέγχου σε κάθε σύνδεση ή όταν κάνετε κλικ στο λογότυπο του CollectiveAccess επάνω.", hu_HU = "Ez az Ön CollectiveAccess irányítópultja. Kattintson fent az „Irányítópult szerkesztése” gombra, hogy widgeteket adjon hozzá a rendszer tevékenységének követéséhez. Az irányítópultot minden bejelentkezéskor, illetve a fenti CollectiveAccess logóra kattintva látja.", pt_BR = "Este é o seu painel do CollectiveAccess. Clique em \"Editar o painel\" acima para adicionar widgets que permitem acompanhar a atividade do sistema. Você verá o painel sempre que fizer login ou clicar no logotipo do CollectiveAccess acima.", pt_PT = "Este é o seu painel do CollectiveAccess. Clique em «Editar o painel» acima para adicionar widgets que lhe permitem acompanhar a atividade do sistema. Verá o painel sempre que iniciar sessão ou clicar no logótipo do CollectiveAccess acima.", sr_RS = "Ово је ваша контролна табла у CollectiveAccess-у. Кликните на дугме „Уреди контролну таблу”