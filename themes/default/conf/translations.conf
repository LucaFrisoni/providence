	"Web Analytics integration" = { az_AZ = "Web Analytics inteqrasiyası", cs_CZ = "Integrace s Web Analytics", el_GR = "Ενσωμάτωση Web Analytics", es_ES = "Integración con analítica web", es_MX = "Integración con analítica web", fr_CA = "Intégration de Web Analytics", fr_FR = "Intégration de Web Analytics", he_IL = "שילוב Web Analytics", hu_HU = "Web Analytics-integráció", it_IT = "Integrazione con Web Analytics", nl_BE = "Integratie met Web Analytics", nl_NL = "Integratie met Web Analytics", pl_PL = "Integracja z Web Analytics", pt_BR = "Integração com Web Analytics", pt_PT = "Integração com Web Analytics", sr_RS = "Интеграција са Web Analytics", sv_SE = "Integration med Web Analytics", uk_UA = "Інтеграція з Web Analytics" },
	"Web analytics integration" = { az_AZ = "Veb analitika inteqrasiyası", cs_CZ = "Integrace webové analytiky", de_AT = "Integration von Webanalysen", el_GR = "Ενσωμάτωση αναλυτικών στοιχείων ιστού", es_ES = "Integración con analítica web", es_MX = "Integración con analítica web", fr_CA = "Intégration de l'analyse web", fr_FR = "Intégration de l'analyse web", he_IL = "שילוב ניתוח אתרים", hu_HU = "Webanalitikai integráció", it_IT = "Integrazione con l'analisi web", nl_BE = "Integratie van webanalyse", nl_NL = "Integratie van webanalyse", pl_PL = "Integracja z analityką internetową", pt_BR = "Integração de análise web", pt_PT = "Integração de análise web", sr_RS = "Интеграција веб аналитике", sv_SE = "Integration med webbanalys", uk_UA = "Інтеграція веб-аналітики" },
	"Web analytics services track and report on application usage and user behavior patterns. Typically, inclusion of service-specific analytics integration code is required. This code should have been provided by your analytics provider and is specific to your account.  Enter it below and it will be embedded on all Pawtucket-served pages." = { az_AZ = "Veb analitika xidmətləri tətbiqdən necə istifadə edildiyini və istifadəçilərin davranışını qeydə alır və hesabat verir. Adətən xidmətin hesabınız üçün təqdim etdiyi xüsusi kod tələb olunur. Onu aşağıya yapışdırın; Pawtucket-in təqdim etdiyi bütün səhifələrə daxil ediləcək.", cs_CZ = "Služby webové analytiky zaznamenávají a vyhodnocují, jak se aplikace používá a jak se chovají uživatelé. Obvykle vyžadují vlastní kód služby, který pro váš účet poskytne poskytovatel. Vložte ho níže; bude zahrnut do všech stránek, které Pawtucket poskytuje.", de_AT = "Webanalyse-Dienste erfassen und berichten, wie die Anwendung genutzt wird und wie sich Benutzer verhalten. Meist ist dafür ein dienstspezifischer Code nötig, den Ihr Anbieter für Ihr Konto bereitstellt. Fügen Sie ihn unten ein; er wird in alle von Pawtucket ausgelieferten Seiten eingebunden.", el_GR = "Οι υπηρεσίες αναλυτικών στοιχείων ιστού καταγράφουν και αναφέρουν τη χρήση της εφαρμογής και τη συμπεριφορά των χρηστών. Συνήθως απαιτείται κώδικας ενσωμάτωσης της συγκεκριμένης υπηρεσίας. Τον κώδικα αυτό τον παρέχει ο πάροχός σας και είναι μοναδικός για τον λογαριασμό σας. Εισαγάγετέ τον παρακάτω και θα ενσωματωθεί σε όλες τις σελίδες του Pawtucket.", es_ES = "Los servicios de analítica web registran e informan cómo se usa la aplicación y cómo se comportan los usuarios. Suelen necesitar un código propio del servicio, que entrega su proveedor y es específico de su cuenta. Péguelo abajo y se incluirá en todas las páginas de Pawtucket.", es_MX = "Los servicios de analítica web registran e informan cómo se usa la aplicación y cómo se comportan los usuarios. Suelen necesitar un código propio del servicio, que entrega su proveedor y es específico de su cuenta. Péguelo abajo y se incluirá en todas las páginas de Pawtucket.", fr_CA = "Les services d'analyse web mesurent et rapportent l'usage de l'application et le comportement des utilisateurs. Ils exigent en général un code propre au service, fourni par votre prestataire pour votre compte. Collez-le ci-dessous ; il sera intégré à toutes les pages servies par Pawtucket.", fr_FR = "Les services d'analyse web mesurent et rapportent l'usage de l'application et le comportement des utilisateurs. Ils exigent en général un code propre au service, fourni par votre prestataire pour votre compte. Collez-le ci-dessous ; il sera intégré à toutes les pages servies par Pawtucket.", he_IL = "שירותי ניתוח אתרים מתעדים ומדווחים כיצד נעשה שימוש ביישום וכיצד המשתמשים מתנהגים. בדרך כלל נדרש קוד ייעודי לשירות, שספק השירות מספק לחשבון שלכם. הדביקו אותו למטה והוא ייכלל בכל הדפים ש-Pawtucket מגיש.", hu_HU = "A webanalitikai szolgáltatások rögzítik és jelentik, hogyan használják az alkalmazást, és hogyan viselkednek a felhasználók. Általában a szolgáltatás saját kódja szükséges, amelyet a szolgáltató ad a fiókjához. Illessze be alább; a Pawtucket által kiszolgált minden oldalra bekerül.", it_IT = "I servizi di analisi web registrano e riferiscono come si usa l'applicazione e come si comportano gli utenti. Di solito richiedono un codice specifico del servizio, fornito dal proprio fornitore per il proprio account. Incollarlo qui sotto: verrà incluso in tutte le pagine servite da Pawtucket.", nl_BE = "Webanalysediensten registreren en rapporteren hoe de toepassing wordt gebruikt en hoe gebruikers zich gedragen. Meestal is daarvoor een eigen code van de dienst nodig, die uw aanbieder voor uw account levert. Plak die hieronder; ze wordt opgenomen in alle pagina's die Pawtucket aanbiedt.", nl_NL = "Webanalysediensten registreren en rapporteren hoe de toepassing wordt gebruikt en hoe gebruikers zich gedragen. Meestal is daarvoor een eigen code van de dienst nodig, die uw aanbieder voor uw account levert. Plak die hieronder; ze wordt opgenomen in alle pagina's die Pawtucket aanbiedt.", pl_PL = "Usługi analityki internetowej rejestrują i raportują sposób korzystania z aplikacji i zachowania użytkowników. Zwykle wymagają własnego kodu usługi, który dostarcza dostawca dla Twojego konta. Wklej go poniżej; zostanie dołączony do wszystkich stron udostępnianych przez Pawtucket.", pt_BR = "Os serviços de análise web registram e informam como a aplicação é usada e como os usuários se comportam. Normalmente exigem um código próprio do serviço, fornecido pelo seu provedor para a sua conta. Cole-o abaixo e ele será incluído em todas as páginas servidas pelo Pawtucket.", pt_PT = "Os serviços de análise web registam e relatam como a aplicação é usada e como os utilizadores se comportam. Normalmente exigem um código próprio do serviço, fornecido pelo seu prestador para a sua conta. Cole-o abaixo e será incluído em todas as páginas servidas pelo Pawtucket.", sr_RS = "Сервиси веб аналитике прате и извештавају о коришћењу апликације и понашању корисника. Обично је потребан код за интеграцију одређеног сервиса. Тај код вам даје ваш пружалац аналитике и јединствен је за ваш налог. Унесите га испод и биће уграђен у све странице које приказује Pawtucket.", sv_SE = "Webbanalystjänster registrerar och rapporterar hur programmet används och hur användarna beter sig. Oftast krävs en egen kod för tjänsten, som leverantören tillhandahåller för ditt konto. Klistra in den nedan; den bäddas in på alla sidor som Pawtucket levererar.", uk_UA = "Служби веб-аналітики реєструють і звітують, як використовується застосунок і як поводяться користувачі. Зазвичай вони потребують власного коду служби, який надає ваш постачальник для вашого облікового запису. Вставте його нижче — його буде додано на всі сторінки, які віддає Pawtucket." },
	"Western Sahara" = { el_GR = "Δυτική Σαχάρα", nl_BE = "Westelijke Sahara", nl_NL = "Westelijke Sahara", sr_RS = "Западна Сахара", uk_UA = "Західна Сахара" },
	"Western Samoa" = { el_GR = "Δυτική Σαμόα", fr_CA = "Samoa", fr_FR = "Samoa", nl_BE = "Samoa", nl_NL = "Samoa", sr_RS = "Западна Самоа", uk_UA = "Самоа" },
	"When deleting an item it is possible to move any references to or from that item to another. Alternatively references can be deleted with the item. The default behavior may be set here." = { az_AZ = "Elementi silərkən ona və ondan olan bütün istinadları başqa elementə köçürmək və ya onunla birlikdə silmək olar. Standart davranış burada təyin edilir.", de_AT = "Beim Löschen eines Elements lassen sich alle Verweise von und zu diesem Element auf ein anderes übertragen; sie können auch mit dem Element gelöscht werden. Hier wird das Standardverhalten festgelegt.", de_DE = "Beim Löschen eines Elements lassen sich alle Verweise von und zu diesem Element auf ein anderes übertragen; sie können auch mit dem Element gelöscht werden. Hier wird das Standardverhalten festgelegt.", el_GR = "Κατά τη διαγραφή ενός στοιχείου, οι αναφορές προς ή από αυτό μπορούν να μεταφερθούν σε άλλο στοιχείο. Εναλλακτικά, οι αναφορές μπορούν να διαγραφούν μαζί με το στοιχείο. Η προεπιλεγμένη συμπεριφορά ορίζεται εδώ.", es_ES = "Al borrar un elemento se pueden pasar sus referencias, desde y hacia ese elemento, a otro; también se pueden borrar con el elemento. Aquí se elige qué se hace por defecto.", es_MX = "Al borrar un elemento se pueden pasar sus referencias, desde y hacia ese elemento, a otro; también se pueden borrar con el elemento. Aquí se elige qué se hace por defecto.", fr_CA = "En supprimant un élément, on peut transférer à un autre ses références, depuis et vers cet élément, ou les supprimer avec lui. Le comportement par défaut se règle ici.", he_IL = "במחיקת פריט אפשר להעביר לפריט אחר את כל ההפניות אליו וממנו, או למחוק אותן יחד איתו. כאן נקבעת התנהגות ברירת המחדל.", hu_HU = "Elem törlésekor az elemre mutató és onnan induló összes hivatkozás áthelyezhető egy másik elemre, vagy törölhető az elemmel együtt. Itt állítható be az alapértelmezett viselkedés.", it_IT = "Eliminando un elemento si possono trasferire a un altro i suoi riferimenti, da e verso quell'elemento, oppure eliminarli insieme a esso. Qui si sceglie il comportamento predefinito.", nl_BE = "Bij het verwijderen van een item kunnen alle verwijzingen van en naar dat item naar een ander worden overgezet, of samen met het item worden verwijderd. Hier stelt u het standaardgedrag in.", nl_NL = "Bij het verwijderen van een item kunnen alle verwijzingen van en naar dat item naar een ander worden overgezet, of samen met het item worden verwijderd. Hier stelt u het standaardgedrag in.", pl_PL = "Przy usuwaniu elementu można przenieść jego odwołania, do i od tego elementu, na inny element albo usunąć je razem z nim. Tutaj ustawia się domyślne zachowanie.", pt_BR = "Ao excluir um item, é possível transferir para outro as suas referências, de e para esse item, ou excluí-las com ele. Aqui se escolhe o comportamento padrão.", pt_PT = "Ao eliminar um item, podem transferir-se para outro as suas referências, de e para esse item, ou eliminá-las com ele. Aqui escolhe-se o comportamento predefinido.", sr_RS = "При брисању ставке могуће је пренети све референце ка њој или од ње на другу ставку. Референце се могу и обрисати заједно са ставком. Подразумевано понашање подешава се овде.", sv_SE = "När en post tas bort kan alla referenser till och från den flyttas till en annan post eller tas bort tillsammans med den. Här anges standardbeteendet.", uk_UA = "Під час видалення елемента можна перенести всі посилання на нього й від нього на інший елемент або видалити їх разом з ним. Тут задається типова поведінка." },
	"When remove images is chosen, images (IMG) will be removed from the display. Useful for ads and big images feeds.<br/>When remove HTML is chosen, all of the feed will be cleaned of any HTML tags, leaving text only." = { az_AZ = "\"Şəkilləri sil\" seçildikdə şəkillər (IMG) göstərilmir; reklam və böyük şəkilli lentlər üçün faydalıdır.<br/>\"HTML-i sil\" seçildikdə lent bütün HTML teqlərindən təmizlənir və yalnız mətn qalır.", de_AT = "Mit „Bilder entfernen“ werden Bilder (IMG) nicht angezeigt; nützlich bei Werbung und Feeds mit großen Bildern.<br/>Mit „HTML entfernen“ wird der Feed von allen HTML-Tags bereinigt, nur der Text bleibt.", de_DE = "Mit „Bilder entfernen“ werden Bilder (IMG) nicht angezeigt; nützlich bei Werbung und Feeds mit großen Bildern.<br/>Mit „HTML entfernen“ wird der Feed von allen HTML-Tags bereinigt, nur der Text bleibt.", el_GR = "Με την «Αφαίρεση εικόνων» οι εικόνες (IMG) δεν εμφανίζονται· χρήσιμο για διαφημίσεις και ροές με μεγάλες εικόνες.<br/>Με την «Αφαίρεση HTML» η ροή καθαρίζεται από κάθε ετικέτα HTML και μένει μόνο το κείμενο.", hu_HU = "A „Képek eltávolítása” beállítással a képek (IMG) nem jelennek meg; hasznos hirdetéseknél és nagy képeket tartalmazó hírcsatornáknál.<br/>A „HTML eltávolítása” beállítással a hírcsatornából minden HTML-címke eltűnik, csak a szöveg marad.", it_IT = "Con «Rimuovi immagini» le immagini (IMG) non vengono mostrate; utile per pubblicità e feed con immagini grandi.<br/>Con «Rimuovi HTML» il feed viene ripulito da ogni tag HTML e resta solo il testo.", pt_BR = "Com \"Remover imagens\", as imagens (IMG) não são mostradas; útil para anúncios e feeds com imagens grandes.<br/>Com \"Remover HTML\", o feed fica sem etiquetas HTML e resta apenas o texto.", pt_PT = "Com «Remover imagens», as imagens (IMG) não são mostradas; útil para anúncios e feeds com imagens grandes.<br/>Com «Remover HTML», o feed fica sem etiquetas HTML e resta apenas o texto.", sr_RS = "Са „Уклони слике” слике (IMG) се не приказују; корисно за рекламе и фидове са великим сликама.<br/>Са „Уклони HTML” фид се чисти од свих HTML ознака и остаје само текст.", uk_UA = "«Видалити зображення» прибирає зображення (IMG); корисно для реклами та стрічок із великими зображеннями.<br/>«Видалити HTML» очищує стрічку від усіх HTML-тегів, лишаючи тільки текст." },
