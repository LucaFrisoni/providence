	"Access status" = { az_AZ = "Giriş statusu", de_AT = "Zugriffsstatus", el_GR = "Κατάσταση πρόσβασης", hu_HU = "Hozzáférési állapot", it_IT = "Stato di accesso", nl_BE = "Toegangsstatus", nl_NL = "Toegangsstatus", sr_RS = "Статус приступа", sv_SE = "Åtkomststatus" },
	"Access values are used to control if and to whom a record should be displayed in a public-facing Pawtucket-based interface. Users logged into the Pawtucket interface will be given the levels of access specified here. If you wish to use the default Pawtucket access policy for an access value set the level to \"Use Pawtucket default.\"" = { az_AZ = "Giriş dəyərləri qeydin Pawtucket əsaslı ictimai interfeysdə göstərilib-göstərilməyəcəyini və kimə göstəriləcəyini müəyyən edir. Pawtucket-ə daxil olmuş istifadəçilər burada göstərilən giriş səviyyələrini alır. Giriş dəyəri üçün Pawtucket-in standart qaydasından istifadə etmək üçün «Pawtucket standartından istifadə et» seçin.", de_AT = "Zugriffswerte steuern, ob und für wen ein Datensatz in einer öffentlichen, auf Pawtucket basierenden Oberfläche angezeigt wird. In Pawtucket angemeldete Benutzer erhalten die hier festgelegten Zugriffsstufen. Um für einen Zugriffswert die Standardregel von Pawtucket zu verwenden, wählen Sie „Pawtucket-Standard verwenden“.", el_GR = "Οι τιμές πρόσβασης καθορίζουν αν και σε ποιον εμφανίζεται μια εγγραφή σε δημόσια διεπαφή βασισμένη στο Pawtucket. Οι χρήστες που έχουν συνδεθεί στο Pawtucket λαμβάνουν τα επίπεδα πρόσβασης που ορίζονται εδώ. Για να εφαρμόσετε την προεπιλεγμένη πολιτική του Pawtucket σε μια τιμή πρόσβασης, επιλέξτε «Προεπιλογή του Pawtucket».", hu_HU = "A hozzáférési értékek szabályozzák, hogy egy rekord megjelenik-e, és kinek, egy Pawtucket-alapú nyilvános felületen. A Pawtucketbe bejelentkezett felhasználók az itt megadott hozzáférési szinteket kapják. Ha egy hozzáférési értékhez a Pawtucket alapértelmezett szabályát szeretné használni, válassza „A Pawtucket alapértelmezésének használata” lehetőséget.", it_IT = "I valori di accesso stabiliscono se e a chi mostrare una scheda in un'interfaccia pubblica basata su Pawtucket. Gli utenti collegati a Pawtucket ricevono i livelli di accesso indicati qui. Per usare la regola predefinita di Pawtucket per un valore di accesso, scegliere «Usa il predefinito di Pawtucket».", nl_BE = "Toegangswaarden bepalen of en voor wie een record wordt getoond in een publieke interface op basis van Pawtucket. Gebruikers die in Pawtucket zijn aangemeld krijgen de hier ingestelde toegangsniveaus. Kies „Standaard van Pawtucket gebruiken” om voor een toegangswaarde de standaardregel van Pawtucket te gebruiken.", nl_NL = "Toegangswaarden bepalen of en voor wie een record wordt getoond in een publieke interface op basis van Pawtucket. Gebruikers die in Pawtucket zijn aangemeld krijgen de hier ingestelde toegangsniveaus. Kies „Standaard van Pawtucket gebruiken” om voor een toegangswaarde de standaardregel van Pawtucket te gebruiken.", pl_PL = "Wartości dostępu określają, czy i komu rekord jest pokazywany w publicznym interfejsie opartym na Pawtucket. Użytkownicy zalogowani w Pawtucket otrzymują ustawione tutaj poziomy dostępu. Aby dla danej wartości użyć domyślnej reguły Pawtucket, wybierz „Użyj domyślnego ustawienia Pawtucket”.", pt_BR = "Os valores de acesso controlam se e a quem um registro é mostrado em uma interface pública baseada no Pawtucket. Os usuários conectados no Pawtucket recebem os níveis de acesso indicados aqui. Para usar a regra predefinida do Pawtucket em um valor de acesso, escolha «Usar o padrão do Pawtucket».", pt_PT = "Os valores de acesso controlam se e a quem um registo é mostrado numa interface pública baseada no Pawtucket. Os utilizadores com sessão iniciada no Pawtucket recebem os níveis de acesso indicados aqui. Para usar a regra predefinida do Pawtucket num valor de acesso, escolha «Usar a predefinição do Pawtucket».", sr_RS = "Вредности приступа одређују да ли се и коме запис приказује у јавном интерфејсу заснованом на Pawtucket-у. Корисници пријављени у Pawtucket добијају нивое приступа наведене овде. Да бисте за вредност приступа применили подразумевано правило Pawtucket-а, изаберите „Подразумевано за Pawtucket”.", sv_SE = "Åtkomstvärden styr om och för vem en post visas i ett publikt gränssnitt byggt på Pawtucket. Användare som är inloggade i Pawtucket får de åtkomstnivåer som anges här. Välj ”Använd Pawtuckets standard” för att använda Pawtuckets standardregel för ett åtkomstvärde.", uk_UA = "Значення доступу визначають, чи показувати запис і кому в публічному інтерфейсі на основі Pawtucket. Користувачі, які увійшли в Pawtucket, отримують вказані тут рівні доступу. Щоб для значення доступу застосувати типове правило Pawtucket, виберіть «Типове значення Pawtucket»." },
