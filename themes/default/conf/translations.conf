	"Set the locale used for all imported data. Leave on \"DEFAULT\" to use the system default locale. Otherwise set it to a valid locale code (Ex. en_US, es_MX, fr_CA)." = { az_AZ = "İdxal olunan bütün verilənlərin dili. Sistemin standart dilindən istifadə üçün «DEFAULT» saxlayın; əks halda düzgün dil kodu göstərin (məsələn, en_US, es_MX, fr_CA).", cs_CZ = "Jazyk všech importovaných dat. Ponechte „DEFAULT“ pro výchozí jazyk systému; jinak zadejte platný kód jazyka (např. en_US, es_MX, fr_CA).", de_AT = "Sprache aller importierten Daten. Lassen Sie „DEFAULT“, um die Standardsprache des Systems zu verwenden; andernfalls geben Sie einen gültigen Sprachcode an (z. B. en_US, es_MX, fr_CA).", de_DE = "Sprache aller importierten Daten. Lassen Sie „DEFAULT“, um die Standardsprache des Systems zu verwenden; andernfalls geben Sie einen gültigen Sprachcode an (z. B. en_US, es_MX, fr_CA).", el_GR = "Ορίστε τη γλώσσα για όλα τα εισαγόμενα δεδομένα. Αφήστε «DEFAULT» για να χρησιμοποιηθεί η προεπιλεγμένη γλώσσα του συστήματος. Διαφορετικά, ορίστε έναν έγκυρο κωδικό γλώσσας (π.χ. en_US, es_MX, fr_CA).", es_ES = "Idioma de todos los datos importados. Deje \"DEFAULT\" para usar el idioma por defecto del sistema; si no, escriba un código de idioma válido (por ejemplo en_US, es_MX, fr_CA).", es_MX = "Idioma de todos los datos importados. Deje \"DEFAULT\" para usar el idioma por defecto del sistema; si no, escriba un código de idioma válido (por ejemplo en_US, es_MX, fr_CA).", fr_CA = "Langue de toutes les données importées. Laissez « DEFAULT » pour utiliser la langue par défaut du système ; sinon indiquez un code de langue valide (p. ex. en_US, es_MX, fr_CA).", fr_FR = "Langue de toutes les données importées. Laissez « DEFAULT » pour utiliser la langue par défaut du système ; sinon indiquez un code de langue valide (p. ex. en_US, es_MX, fr_CA).", he_IL = "שפת כל הנתונים המיובאים. השאירו „DEFAULT” כדי להשתמש בשפת ברירת המחדל של המערכת; אחרת ציינו קוד שפה תקין (למשל en_US‏, es_MX‏, fr_CA).", hu_HU = "Az összes importált adat nyelve. Hagyja „DEFAULT” értéken a rendszer alapértelmezett nyelvéhez; egyébként adjon meg érvényes nyelvkódot (pl. en_US, es_MX, fr_CA).", it_IT = "Lingua di tutti i dati importati. Lasciare «DEFAULT» per usare la lingua predefinita del sistema; altrimenti indicare un codice di lingua valido (es. en_US, es_MX, fr_CA).", nl_BE = "Taal van alle geïmporteerde gegevens. Laat „DEFAULT” staan voor de standaardtaal van het systeem; geef anders een geldige taalcode op (bijv. en_US, es_MX, fr_CA).", nl_NL = "Taal van alle geïmporteerde gegevens. Laat „DEFAULT” staan voor de standaardtaal van het systeem; geef anders een geldige taalcode op (bijv. en_US, es_MX, fr_CA).", pl_PL = "Język wszystkich importowanych danych. Pozostaw „DEFAULT”, aby użyć domyślnego języka systemu; w przeciwnym razie podaj prawidłowy kod języka (np. en_US, es_MX, fr_CA).", pt_BR = "Idioma de todos os dados importados. Deixe «DEFAULT» para usar o idioma padrão do sistema; caso contrário, indique um código de idioma válido (por exemplo en_US, es_MX, fr_CA).", pt_PT = "Idioma de todos os dados importados. Deixe «DEFAULT» para usar o idioma predefinido do sistema; caso contrário, indique um código de idioma válido (por exemplo en_US, es_MX, fr_CA).", sr_RS = "Подесите језик за све увезене податке. Оставите „DEFAULT” да бисте користили подразумевани језик система. У супротном унесите важећи код језика (нпр. en_US, es_MX, fr_CA).", sv_SE = "Språk för alla importerade data. Lämna ”DEFAULT” för systemets standardspråk; ange annars en giltig språkkod (t.ex. en_US, es_MX, fr_CA).", uk_UA = "Мова всіх імпортованих даних. Залиште «DEFAULT», щоб використовувати типову мову системи; інакше вкажіть правильний код мови (наприклад, en_US, es_MX, fr_CA)." },
	"Set this if this label is the preferred label for the current locale." = { az_AZ = "Bu ad cari dil üçün üstün tutulan addırsa, seçin.", cs_CZ = "Zaškrtněte, pokud je to preferovaný název pro aktuální jazyk.", de_AT = "Aktivieren, wenn diese Bezeichnung die bevorzugte für die aktuelle Sprache ist.", de_DE = "Aktivieren, wenn diese Bezeichnung die bevorzugte für die aktuelle Sprache ist.", el_GR = "Επιλέξτε αν αυτή η ετικέτα είναι η προτιμώμενη για την τρέχουσα γλώσσα.", es_ES = "Márquelo si este es el nombre preferido para el idioma actual.", es_MX = "Márquelo si este es el nombre preferido para el idioma actual.", fr_CA = "Cochez si ce libellé est le libellé préféré pour la langue actuelle.", fr_FR = "Cochez si ce libellé est le libellé préféré pour la langue actuelle.", he_IL = "סמנו אם זה השם המועדף לשפה הנוכחית.", hu_HU = "Jelölje be, ha ez az elsődleges megnevezés a jelenlegi nyelven.", it_IT = "Selezionare se questa è la denominazione preferita per la lingua attuale.", nl_BE = "Aanvinken als dit de voorkeursbenaming voor de huidige taal is.", nl_NL = "Aanvinken als dit de voorkeursbenaming voor de huidige taal is.", pl_PL = "Zaznacz, jeśli to nazwa preferowana dla bieżącego języka.", pt_BR = "Marque se esta é a designação preferida para o idioma atual.", pt_PT = "Assinale se esta é a designação preferida para o idioma atual.", sr_RS = "Означите ако је ова ознака основна за тренутни језик.", sv_SE = "Markera om detta är den föredragna benämningen för det aktuella språket.", uk_UA = "Позначте, якщо це основна назва для поточної мови." },
