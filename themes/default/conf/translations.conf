	"Global value editor" = { az_AZ = "Qlobal dəyərlər redaktoru", de_AT = "Editor für globale Werte", de_DE = "Editor für globale Werte", el_GR = "Επεξεργαστής γενικών τιμών", es_ES = "Editor de valores globales", es_MX = "Editor de valores globales", fr_CA = "Éditeur de valeurs globales", he_IL = "עורך ערכים גלובליים", hu_HU = "Globális értékek szerkesztője", it_IT = "Editor dei valori globali", nl_BE = "Editor voor globale waarden", nl_NL = "Editor voor globale waarden", pl_PL = "Edytor wartości globalnych", pt_BR = "Editor de valores globais", pt_PT = "Editor de valores globais", sr_RS = "Уређивач глобалних вредности", sv_SE = "Redigerare för globala värden", uk_UA = "Редактор глобальних значень" },
	"Global values" = { az_AZ = "Qlobal dəyərlər", de_AT = "Globale Werte", de_DE = "Globale Werte", el_GR = "Γενικές τιμές", es_ES = "Valores globales", es_MX = "Valores globales", fr_CA = "Valeurs globales", he_IL = "ערכים גלובליים", hu_HU = "Globális értékek", it_IT = "Valori globali", nl_BE = "Globale waarden", nl_NL = "Globale waarden", pl_PL = "Wartości globalne", pt_BR = "Valores globais", pt_PT = "Valores globais", sr_RS = "Глобалне вредности", sv_SE = "Globala värden", uk_UA = "Глобальні значення" },
	"Global values are editable text values that may be displayed in any view template in your Pawtucket theme. They are especially useful for managing semi-static text embedded in a web site, such as upcoming holiday hours or planned maintenance. You may edit globals using the form below. Configure additional global values by adding them to your theme app.conf configuration file." = { az_AZ = "Qlobal dəyərlər Pawtucket mövzunuzun istənilən görünüş şablonunda göstərilə bilən redaktə edilə bilən mətnlərdir. Onlar xüsusilə saytın demək olar ki, sabit mətnləri üçün faydalıdır, məsələn bayram günlərində iş saatları və ya planlaşdırılmış texniki işlər. Onları aşağıdakı formada redaktə edin; yenilərini mövzunun app.conf faylında əlavə edin.", de_AT = "Globale Werte sind bearbeitbare Texte, die in jeder Ansichtsvorlage Ihres Pawtucket-Themes angezeigt werden können. Sie eignen sich besonders für fast feste Texte der Website, etwa Öffnungszeiten an Feiertagen oder geplante Wartungen. Sie werden mit dem Formular unten bearbeitet; weitere globale Werte legen Sie in der app.conf Ihres Themes an.", de_DE = "Globale Werte sind bearbeitbare Texte, die in jeder Ansichtsvorlage Ihres Pawtucket-Themes angezeigt werden können. Sie eignen sich besonders für fast feste Texte der Website, etwa Öffnungszeiten an Feiertagen oder geplante Wartungen. Sie werden mit dem Formular unten bearbeitet; weitere globale Werte legen Sie in der app.conf Ihres Themes an.", el_GR = "Οι γενικές τιμές είναι επεξεργάσιμα κείμενα που μπορούν να εμφανίζονται σε οποιοδήποτε πρότυπο προβολής του θέματος Pawtucket. Είναι ιδιαίτερα χρήσιμες για ημιστατικό κείμενο ενσωματωμένο σε έναν ιστότοπο, όπως ωράρια αργιών ή προγραμματισμένη συντήρηση. Μπορείτε να επεξεργαστείτε τις γενικές τιμές με την παρακάτω φόρμα. Ρυθμίστε επιπλέον γενικές τιμές προσθέτοντάς τες στο αρχείο ρυθμίσεων app.conf του θέματος.", es_ES = "Los valores globales son textos editables que se pueden mostrar en cualquier plantilla de vista del tema de Pawtucket. Sirven sobre todo para textos casi fijos del sitio web, como horarios de feriados o mantenimientos previstos. Se editan con el formulario de abajo; para agregar otros, configúrelos en el archivo app.conf del tema.", es_MX = "Los valores globales son textos editables que se pueden mostrar en cualquier plantilla de vista del tema de Pawtucket. Sirven sobre todo para textos casi fijos del sitio web, como horarios de feriados o mantenimientos previstos. Se editan con el formulario de abajo; para agregar otros, configúrelos en el archivo app.conf del tema.", fr_CA = "Les valeurs globales sont des textes modifiables qui peuvent s'afficher dans n'importe quel modèle de vue de votre thème Pawtucket. Elles servent surtout aux textes presque fixes du site, comme les horaires des jours fériés ou les maintenances prévues. Modifiez-les avec le formulaire ci-dessous ; pour en ajouter, configurez-les dans le fichier app.conf de votre thème.", he_IL = "ערכים גלובליים הם טקסטים ניתנים לעריכה שאפשר להציג בכל תבנית תצוגה של ערכת הנושא של Pawtucket. הם שימושיים במיוחד לטקסטים כמעט קבועים באתר, כמו שעות פתיחה בחגים או תחזוקה מתוכננת. עורכים אותם בטופס שלמטה; כדי להוסיף עוד, מגדירים אותם בקובץ app.conf של ערכת הנושא.", hu_HU = "A globális értékek szerkeszthető szövegek, amelyek a Pawtucket-téma bármely nézetsablonjában megjeleníthetők. Különösen hasznosak a webhely szinte állandó szövegeihez, például az ünnepnapi nyitvatartáshoz vagy a tervezett karbantartáshoz. Az alábbi űrlapon szerkeszthetők; továbbiakat a téma app.conf fájljában adhat hozzá.", it_IT = "I valori globali sono testi modificabili che si possono mostrare in qualsiasi modello di vista del tema Pawtucket. Servono soprattutto per testi quasi fissi del sito, come gli orari dei giorni festivi o le manutenzioni previste. Si modificano con il modulo qui sotto; per aggiungerne altri, configurarli nel file app.conf del tema.", nl_BE = "Globale waarden zijn bewerkbare teksten die in elk weergavesjabloon van uw Pawtucket-thema getoond kunnen worden. Ze zijn vooral handig voor bijna vaste teksten op de website, zoals openingstijden op feestdagen of gepland onderhoud. Bewerk ze met het formulier hieronder; voeg er meer toe in het bestand app.conf van uw thema.", nl_NL = "Globale waarden zijn bewerkbare teksten die in elk weergavesjabloon van uw Pawtucket-thema getoond kunnen worden. Ze zijn vooral handig voor bijna vaste teksten op de website, zoals openingstijden op feestdagen of gepland onderhoud. Bewerk ze met het formulier hieronder; voeg er meer toe in het bestand app.conf van uw thema.", pl_PL = "Wartości globalne to edytowalne teksty, które można wyświetlać w dowolnym szablonie widoku motywu Pawtucket. Przydają się zwłaszcza do niemal stałych tekstów witryny, np. godzin otwarcia w święta lub planowanych przerw technicznych. Edytuje się je w formularzu poniżej; kolejne dodaje się w pliku app.conf motywu.", pt_BR = "Os valores globais são textos editáveis que se podem mostrar em qualquer modelo de vista do tema Pawtucket. Servem sobretudo para textos quase fixos do site, como horários de feriados ou manutenções previstas. São editados com o formulário abaixo; para acrescentar outros, configure-os no arquivo app.conf do tema.", pt_PT = "Os valores globais são textos editáveis que se podem mostrar em qualquer modelo de vista do tema Pawtucket. Servem sobretudo para textos quase fixos do site, como horários de feriados ou manutenções previstas. Editam-se com o formulário abaixo; para acrescentar outros, configure-os no ficheiro app.conf do tema.", sr_RS = "Глобалне вредности су текстови који се могу уређивати и приказати у било ком шаблону приказа ваше Pawtucket теме. Посебно су корисне за полустатички текст уграђен у сајт, као што су празнично радно време или планирано одржавање. Глобалне вредности можете уређивати у обрасцу испод. Додатне глобалне вредности подесите тако што ћете их додати у конфигурациону датотеку app.conf ваше теме.", sv_SE = "Globala värden är redigerbara texter som kan visas i valfri vymall i ditt Pawtucket-tema. De passar särskilt för nästan fasta texter på webbplatsen, som öppettider under helgdagar eller planerat underhåll. Redigera dem i formuläret nedan; lägg till fler i temats app.conf.", uk_UA = "Глобальні значення — це редаговані тексти, які можна показувати в будь-якому шаблоні подання теми Pawtucket. Вони особливо зручні для майже незмінних текстів сайту, як-от графік роботи у святкові дні чи заплановане обслуговування. Редагуйте їх у формі нижче; щоб додати інші, налаштуйте їх у файлі app.conf теми." },
	"Go directly to record when search result is a single record and search matches identifier." = { az_AZ = "Axtarış identifikatora uyğun tək nəticə verdikdə birbaşa qeydə keçin.", cs_CZ = "Přejít přímo na záznam, když hledání vrátí jediný výsledek odpovídající identifikátoru.", el_GR = "Άμεση μετάβαση στην εγγραφή όταν η αναζήτηση επιστρέφει ένα μόνο αποτέλεσμα που ταιριάζει με το αναγνωριστικό.", es_ES = "Ir directamente al registro cuando la búsqueda da un único resultado y coincide con el identificador.", es_MX = "Ir directamente al registro cuando la búsqueda da un único resultado y coincide con el identificador.", fr_CA = "Aller directement à l’enregistrement lorsque la recherche renvoie un seul résultat correspondant à l’identifiant.", fr_FR = "Aller directement à l’enregistrement lorsque la recherche renvoie un seul résultat correspondant à l’identifiant.", he_IL = "מעבר ישיר לרשומה כאשר החיפוש מחזיר תוצאה אחת התואמת למזהה.", hu_HU = "Közvetlen ugrás a rekordra, ha a keresés egyetlen, az azonosítónak megfelelő találatot ad.", it_IT = "Vai direttamente al record quando la ricerca restituisce un solo risultato che corrisponde all’identificativo.", nl_BE = "Direct naar het record gaan als de zoekopdracht één resultaat oplevert dat overeenkomt met de identificatie.", nl_NL = "Direct naar het record gaan als de zoekopdracht één resultaat oplevert dat overeenkomt met de identificatie.", pl_PL = "Przejdź bezpośrednio do rekordu, gdy wyszukiwanie zwraca jeden wynik zgodny z identyfikatorem.", pt_BR = "Ir diretamente para o registro quando a busca retorna um único resultado que corresponde ao identificador.", pt_PT = "Ir diretamente para o registo quando a pesquisa devolve um único resultado que corresponde ao identificador.", sr_RS = "Пређи директно на запис када претрага врати један резултат који одговара идентификатору.", sv_SE = "Gå direkt till posten när sökningen ger en enda träff som matchar identifieraren.", uk_UA = "Переходити одразу до запису, коли пошук повертає один результат, що збігається з ідентифікатором." },
