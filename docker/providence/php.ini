; Ajustes de PHP para desarrollo (valores sugeridos en la guía de instalación de Providence)
memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 130M
max_execution_time = 300
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; Revalidar archivos en cada petición: el código se edita desde el host
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
