# Entorno de desarrollo de la extensión: Providence + MySQL + servicio Rust.
# Se publican en la computadora (solo en 127.0.0.1) Providence y MySQL; el servicio Rust queda
# dentro de la red de Docker.
# Requiere un archivo .env (copiar .env.example). Ver docker/README.md
name: ca-extension

# Bloque reutilizable ("x-" = Compose lo ignora como servicio). &db-env le da nombre y
# Providence lo incluye con <<: *db-env. ${VAR:?msg} corta el arranque si VAR falta en .env
x-db-env: &db-env
  CA_DB_HOST: db
  TZ: ${TZ:-America/Argentina/Buenos_Aires}
  CA_DB_USER: ${CA_DB_USER:?Falta CA_DB_USER en .env}
  CA_DB_PASSWORD: ${CA_DB_PASSWORD:?Falta CA_DB_PASSWORD en .env}
  CA_DB_DATABASE: ${CA_DB_DATABASE:?Falta CA_DB_DATABASE en .env}

# Conexión a la base propia de la extensión, que usa el servicio Rust
x-ext-db-env: &ext-db-env
  EXT_DB_HOST: db
  TZ: ${TZ:-America/Argentina/Buenos_Aires}
  EXT_DB_DATABASE: ${EXT_DB_DATABASE:?Falta EXT_DB_DATABASE en .env}
  EXT_DB_USER: ${EXT_DB_USER:?Falta EXT_DB_USER en .env}
  EXT_DB_PASSWORD: ${EXT_DB_PASSWORD:?Falta EXT_DB_PASSWORD en .env}

services:
  db:
    image: mysql:8.4.11
    # Parámetros de MySQL: utf8mb4 para guardar bien acentos, ñ y cualquier carácter Unicode
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      # Para conectarse desde la computadora (DBeaver, etc.). 127.0.0.1 = no accesible desde la red.
      # DB_PORT se define en .env (3307 en .env.example, para no chocar con un MySQL local)
      - "127.0.0.1:${DB_PORT:?Falta DB_PORT en .env}:3306"
    environment:
      # Zona horaria de los equipos: la usan NOW() y CURRENT_TIMESTAMP
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${CA_DB_DATABASE:?Falta CA_DB_DATABASE en .env}
      MYSQL_USER: ${CA_DB_USER:?Falta CA_DB_USER en .env}
      MYSQL_PASSWORD: ${CA_DB_PASSWORD:?Falta CA_DB_PASSWORD en .env}
    volumes:
      # Volumen con nombre: la base persiste aunque se borre el contenedor (se pierde con down -v)
      - db_data:/var/lib/mysql
    healthcheck:
      # Por TCP (127.0.0.1): en la primera inicialización MySQL levanta un servidor temporal sin red
      # que respondería al ping por socket antes de estar listo.
      # Seguridad:La contraseña se lee dentro del contenedor, no queda escrita en este archivo
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 5s
      retries: 30

  providence:
    build:
      context: .
      dockerfile: docker/providence/Dockerfile
    ports:
      # pc:contenedor. 127.0.0.1 = solo accesible desde esta computadora, no desde la red
      - "127.0.0.1:${PROVIDENCE_PORT:-8080}:80"
    environment:
      <<: *db-env
      CA_ADMIN_USERNAME: ${CA_ADMIN_USERNAME:?Falta CA_ADMIN_USERNAME en .env}
      CA_ADMIN_EMAIL: ${CA_ADMIN_EMAIL:?Falta CA_ADMIN_EMAIL en .env}
      CA_ADMIN_PASSWORD: ${CA_ADMIN_PASSWORD:?Falta CA_ADMIN_PASSWORD en .env}
      CA_INSTALL_PROFILE: ${CA_INSTALL_PROFILE:-default}
      CA_DEFAULT_LOCALE: ${CA_DEFAULT_LOCALE:-en_US}
      # Dentro de la red de Docker cada servicio se alcanza por su nombre
      EXTENSION_SERVICE_URL: http://extension-service:8000
      # Solo el nombre (sin credenciales): lo usan las pruebas que verifican que Providence no accede a ella
      EXT_DB_DATABASE: ${EXT_DB_DATABASE:?Falta EXT_DB_DATABASE en .env}
    volumes:
      # Bind mount: la carpeta local de plugins aparece dentro del contenedor y los cambios se ven al
      # instante, sin reconstruir. El núcleo de Providence queda dentro de la imagen
      - ./app/plugins:/var/www/html/app/plugins
      # Volúmenes con nombre: persisten los archivos subidos a Providence
      - media:/var/www/html/media
      - uploads:/var/www/html/uploads
      # Configuración local de Providence (sobrescrituras de app/conf). La escribe el módulo 2 y
      # persiste aunque se reconstruya la imagen
      - conf_local:/var/www/html/app/conf/local
    # Orden de arranque: espera a que el healthcheck de la base dé OK y a que el servicio Rust haya iniciado
    depends_on:
      db:
        condition: service_healthy
      extension-service:
        condition: service_started

  # Tarea de un solo uso: crea la base propia de la extensión y su usuario (ver docker/db/) y termina.
  # Corre en cada "up", así también funciona con bases creadas antes de agregarla
  extension-db-init:
    image: mysql:8.4
    # sed quita los fines de línea de Windows (CRLF) que puede agregar git al clonar
    entrypoint: ["bash", "-c", "sed 's/\\r$$//' /docker/init-extension-db.sh | bash"]
    environment:
      DB_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      CA_DB_DATABASE: ${CA_DB_DATABASE:?Falta CA_DB_DATABASE en .env}
      CA_DB_USER: ${CA_DB_USER:?Falta CA_DB_USER en .env}
      EXT_DB_DATABASE: ${EXT_DB_DATABASE:?Falta EXT_DB_DATABASE en .env}
      EXT_DB_USER: ${EXT_DB_USER:?Falta EXT_DB_USER en .env}
      EXT_DB_PASSWORD: ${EXT_DB_PASSWORD:?Falta EXT_DB_PASSWORD en .env}
    volumes:
      - ./docker/db/init-extension-db.sh:/docker/init-extension-db.sh:ro
    depends_on:
      db:
        condition: service_healthy

  extension-service:
    build: ./rust/extension-service
    # Sin "ports": no se publica en la computadora, solo Providence lo alcanza por la red interna
    # Conexión a la base propia de la extensión (no tiene acceso a la base de Providence)
    environment: 
      <<: *ext-db-env
      
      # Módulo 6: fuentes externas. Se definen en .env (ver .env.example); vacía = sin configurar.
      # El servicio sí sale a internet para consultar Wikidata, VIAF, Getty, etc.
      M6_TIMEOUT_MS: ${M6_TIMEOUT_MS:-2500}
      M6_NUMISHARE_URL: ${M6_NUMISHARE_URL:-}
      M6_EOL_CLAVE: ${M6_EOL_CLAVE:-}
      M6_GLOBALNAMES_FUENTES: ${M6_GLOBALNAMES_FUENTES:-}
      M6_SPARQL_URL: ${M6_SPARQL_URL:-}
      M6_SPARQL_CONSULTA: ${M6_SPARQL_CONSULTA:-}
      M6_SPARQL_VAR_URI: ${M6_SPARQL_VAR_URI:-}
      M6_SPARQL_VAR_ETIQUETA: ${M6_SPARQL_VAR_ETIQUETA:-}
      M6_CA_URL: ${M6_CA_URL:-}
      M6_CA_USUARIO: ${M6_CA_USUARIO:-}
      M6_CA_CLAVE: ${M6_CA_CLAVE:-}
      M6_CA_TABLA: ${M6_CA_TABLA:-}
      M6_CA_PLANTILLA: ${M6_CA_PLANTILLA:-}
      M6_RS_URL: ${M6_RS_URL:-}
      M6_RS_USUARIO: ${M6_RS_USUARIO:-}
      M6_RS_CLAVE: ${M6_RS_CLAVE:-}
      M6_WORLDCAT_CLAVE: ${M6_WORLDCAT_CLAVE:-}  
    # Arranca cuando la base de la extensión ya está creada
    depends_on:
      extension-db-init:
        condition: service_completed_successfully

# Declaración de los volúmenes con nombre usados arriba
volumes:
  db_data:
  media:
  uploads:
  conf_local:
