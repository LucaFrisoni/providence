# Entorno de desarrollo de la extensión: Providence + MySQL + servicio Rust.
# Solo Providence se publica en la computadora; el servicio Rust queda dentro de la red de Docker.
# Requiere un archivo .env (copiar .env.example). Ver docker/README.md
name: ca-extension

# Bloque reutilizable ("x-" = Compose lo ignora como servicio). &db-env le da nombre y
# Providence lo incluye con <<: *db-env. ${VAR:?msg} corta el arranque si VAR falta en .env
x-db-env: &db-env
  CA_DB_HOST: db
  CA_DB_USER: ${CA_DB_USER:?Falta CA_DB_USER en .env}
  CA_DB_PASSWORD: ${CA_DB_PASSWORD:?Falta CA_DB_PASSWORD en .env}
  CA_DB_DATABASE: ${CA_DB_DATABASE:?Falta CA_DB_DATABASE en .env}

services:
  db:
    image: mysql:8.4
    # Parámetros de MySQL: utf8mb4 para guardar bien acentos, ñ y cualquier carácter Unicode
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${CA_DB_DATABASE:?Falta CA_DB_DATABASE en .env}
      MYSQL_USER: ${CA_DB_USER:?Falta CA_DB_USER en .env}
      MYSQL_PASSWORD: ${CA_DB_PASSWORD:?Falta CA_DB_PASSWORD en .env}
    volumes:
      # Volumen con nombre: la base persiste aunque se borre el contenedor (se pierde con down -v)
      - db_data:/var/lib/mysql
    healthcheck:
      # Por TCP (127.0.0.1): en la primera inicialización MySQL levanta un servidor temporal sin red
      # que respondería al ping por socket antes de estar listo.
      # Seguridad:La contraseña se lee dentro del contenedor, no queda escrita en este archivo
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 5s
      retries: 30

  providence:
    build:
      context: .
      dockerfile: docker/providence/Dockerfile
    ports:
      # pc:contenedor. 127.0.0.1 = solo accesible desde esta computadora, no desde la red
      - "127.0.0.1:${PROVIDENCE_PORT:-8080}:80"
    environment:
      <<: *db-env
      CA_ADMIN_USERNAME: ${CA_ADMIN_USERNAME:?Falta CA_ADMIN_USERNAME en .env}
      CA_ADMIN_EMAIL: ${CA_ADMIN_EMAIL:?Falta CA_ADMIN_EMAIL en .env}
      CA_ADMIN_PASSWORD: ${CA_ADMIN_PASSWORD:?Falta CA_ADMIN_PASSWORD en .env}
      CA_INSTALL_PROFILE: ${CA_INSTALL_PROFILE:-default}
      CA_DEFAULT_LOCALE: ${CA_DEFAULT_LOCALE:-en_US}
      # Dentro de la red de Docker cada servicio se alcanza por su nombre
      EXTENSION_SERVICE_URL: http://extension-service:8000
    volumes:
      # Bind mount: la carpeta local de plugins aparece dentro del contenedor y los cambios se ven al
      # instante, sin reconstruir. El núcleo de Providence queda dentro de la imagen
      - ./app/plugins:/var/www/html/app/plugins
      # Volúmenes con nombre: persisten los archivos subidos a Providence
      - media:/var/www/html/media
      - uploads:/var/www/html/uploads
      # Configuración local de Providence (sobrescrituras de app/conf). La escribe el módulo 2 y
      # persiste aunque se reconstruya la imagen
      - conf_local:/var/www/html/app/conf/local
    # Orden de arranque: espera a que el healthcheck de la base dé OK y a que el servicio Rust haya iniciado
    depends_on:
      db:
        condition: service_healthy
      extension-service:
        condition: service_started

  extension-service:
    build: ./rust/extension-service
    # Sin "ports": no se publica en la computadora, solo Providence lo alcanza por la red interna

# Declaración de los volúmenes con nombre usados arriba
volumes:
  db_data:
  media:
  uploads:
  conf_local:
